name: CV validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure private files are not tracked
        shell: bash
        run: |
          set -euo pipefail

          if git ls-files --error-unmatch personal.yaml >/dev/null 2>&1; then
            echo "personal.yaml must never be committed."
            exit 1
          fi

          if [ -n "$(git ls-files 'photo.jpg' 'photo.jpeg' 'photo.png' 'photo.webp')" ]; then
            echo "Local photo files must not be committed."
            exit 1
          fi

          if [ -n "$(git ls-files '*.pdf')" ]; then
            echo "Generated PDF files must not be committed."
            exit 1
          fi

          if [ -n "$(git ls-files '.europass-browser-profile/**' '.europass-debug/**')" ]; then
            echo "Europass browser/debug state may contain private data and must never be committed."
            exit 1
          fi

          if [ -n "$(git ls-files 'node_modules/**')" ]; then
            echo "node_modules must not be committed."
            exit 1
          fi

      - name: Validate Europass automation syntax
        shell: bash
        run: |
          node --check scripts/read-cv-data.mjs
          node --check scripts/europass-fill.mjs

      - name: Install Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1

      - name: Validate CV build
        shell: bash
        run: |
          cp personal.example.yaml personal.yaml
          typst compile cv.typ /tmp/Vitalii_Hanych_CV.pdf

      - name: Validate CV build with photo
        shell: bash
        run: |
          cat > photo-ci.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="300" height="300">
            <rect width="300" height="300" fill="#ddd"/>
            <circle cx="150" cy="115" r="60" fill="#999"/>
            <rect x="70" y="185" width="160" height="115" rx="55" fill="#999"/>
          </svg>
          EOF
          cp personal.example.yaml personal.yaml
          sed -i 's/show_photo: false/show_photo: true/' personal.yaml
          sed -i 's#photo_path: "photo.jpg"#photo_path: "photo-ci.svg"#' personal.yaml
          typst compile cv.typ /tmp/Vitalii_Hanych_CV_with_photo.pdf

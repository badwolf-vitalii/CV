name: CV validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure private files are not tracked
        shell: bash
        run: |
          set -euo pipefail

          if git ls-files --error-unmatch personal.yaml >/dev/null 2>&1; then
            echo "personal.yaml must never be committed."
            exit 1
          fi

          if [ -n "$(git ls-files 'photo.jpg' 'photo.jpeg' 'photo.png' 'photo.webp')" ]; then
            echo "Local photo files must not be committed."
            exit 1
          fi

          if [ -n "$(git ls-files '*.pdf')" ]; then
            echo "Generated PDF files must not be committed."
            exit 1
          fi

      - name: Install Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1

      - name: Validate CV build
        shell: bash
        run: |
          cp personal.example.yaml personal.yaml
          typst compile cv.typ /tmp/Vitalii_Hanych_CV.pdf
